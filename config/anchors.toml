reason = "無純物穿裝備。與吸血鬼權杖同構：無被動的基礎組件，單價不被被動污染。成品（致死宣告 25.8、席利妲 19.3、多明尼克 30.7）的試算值被被動稀釋，不採。NNLS 給 26.75（低信賴，僅 4 件）。"

[armor_pen_flat]
item_id = 3134   # 殘暴之力 (1000 − 20AD×35) / 10 穿甲 = 30.0 每 1 穿甲
deduct = ["ad"]
reason = "穿甲（PhysicalLethality）曾因欄位命名盲點被靜默丟棄，2026-08-15 修復後現身（12 件）。殘暴之力是無被動基礎組件，與權杖／耳語同構。NNLS 給 33.7，兩法互相印證。"
