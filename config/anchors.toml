[life_steal]
item_id = 1053   # 吸血鬼權杖 (900 − 15AD×35) / 7% = 53.571 每 1%
deduct = ["ad"]
reason = "無純吸血基礎裝備（七件帶吸血裝備皆複合屬性）。社群傳統扣除法：權杖扣掉物攻餘額歸吸血。代價：權杖自身 CP值 被鎖成 100%。NNLS 給 37.0，兩法分歧本身是分析入口。"

