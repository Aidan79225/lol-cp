# 錨定基礎裝備 —— 每種屬性指定一件單一屬性的基礎裝備，
# 單價 = total_gold / 正規化後的屬性數量。
#
# item_id 一律為數值 ID，絕不以名稱指定。
# 名稱會拿到其他遊戲模式的變體：長劍 1036(350g) 另有 771036(400g)，
# 治療寶珠 1006(300g) 另有 771006(180g) 且用不同的屬性欄位。
# 用名稱查找會讓單價全錯，而且不會報錯。
#
# 屬性鍵名為 StatKey 成員名的 snake_case。

[ad]
item_id = 1036   # 長劍 350g / 10 物攻 = 35.0
reason = "社群通用值。排除剔除鐮刀(450g/7AD=64.29)——那是帶被動的線上裝，單價被被動污染。"

