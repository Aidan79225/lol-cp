# 出裝規劃器常數（spec 2026-09-14 §3、§7.1）。主觀擇定、可爭論。改這裡不改碼。

# 持有第 1..6 件成品時的等級。
levels = [9, 11, 13, 15, 16, 18]

# 六神裝的持有權重（等價金幣）。前 5 件的持有權重是「下一件的價格」——
# 金幣收入近似等速，攢下一件所需的金幣就是持有目前出裝的時間。
final_holding_gold = 3000

# 生存重要度：score = DPS × (EHP / 同等級裸裝EHP)^beta。
# 0 = 純輸出；1 = 完整的「死前總傷害」。UI 可臨時調整，此處為預設。
# 原型實測（16.16.1 達瑞文）：0 與 0.25 推薦相同，0.5 起引入半肉裝。
beta = 0.25

# 鞋在第幾件買；0 = 不出鞋。模型不算移速，不固定鞋位時鞋一律排最後。
boots_slot = 2

# beam search 保留的組合數。集合數 ≤ 此值時結果為全域最佳。
beam_width = 40

# 接近的替代選項（spec 2026-09-16 near-tie）：每一步列出分數差距在此比例內的
# 其他合法候選。實測「第一件」常由 1% 以內的差距決定，遠小於模型誤差 ——
# 列出替代是為了不把這種差距呈現成確定答案。0 = 不顯示。
alternative_tolerance = 0.03
max_alternatives = 3
