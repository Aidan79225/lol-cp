# 達瑞文技能模型的操作假設（spec 2026-09-15 champion-kits §6.1）。預設：熟練玩家。
# 這些是主觀擇定的旋鈕 —— 調低即代表你實際打不到這個水準。

# 主升順序（大絕在 6／11／16 級自動升）。
skill_order = ["Q", "W", "E"]

# 帶旋轉飛斧的普攻比例。斧頭滯空時間固定，實戰上約 70–80% 的普攻帶斧
# （本專案目標玩家的實測值）；全程雙斧不掉 = 1.0，只維持一把約 0.5。
q_empowered_attack_ratio = 0.75

# 狂熱血性的攻速持續率。接住飛斧會重置 W 冷卻，熟練時近乎常駐。
w_uptime = 1.0
